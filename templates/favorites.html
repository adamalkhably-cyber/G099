<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Favorites</title>
  <link rel="stylesheet" href="/static/theme.css">
<script src="/static/app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="layout">
<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/><path d="M8 6V4a2 2 0 0 1 4 0v2"/></svg>
    </div>
    <div class="brand-name">Wardrobe</div>
    <div class="brand-sub">Digital Closet</div>
  </div>

  <div class="sidebar-section">Main</div>

  <a class="nav-item" href="/dashboard">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Dashboard
  </a>

  <a class="nav-item" href="/wardrobe">
    <svg viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5z"/><path d="M14 5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V5z"/><path d="M4 17a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2z"/><path d="M14 13a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-6z"/></svg>
    My Wardrobe
  </a>

  <a class="nav-item" href="/outfits">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
    Outfit Planner
  </a>

  <a class="nav-item active" href="/favorites">
    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    Favorites
  </a>

  <div class="sidebar-section">Insights</div>

  <a class="nav-item" href="/calendar">
    <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-4 4"/></svg>
    Outfits Worn This Week
  </a>

  <div class="sidebar-section">Settings</div>

  <a class="nav-item" href="/settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6.1A10 10 0 0 0 2.05 14"/><path d="M5.08 19.14A10 10 0 0 0 12 22c1.39 0 2.72-.28 3.93-.79"/><path d="M19.07 19.07A10 10 0 0 0 22 12a10 10 0 0 0-.08-1.32"/></svg>
    Settings
  </a>

  <div class="sidebar-spacer"></div>

<div class="sidebar-profile">
    <div class="sidebar-profile-left">
        <div class="avatar-container">
            <img id="sidebar-avatar-img" src="" alt="Profile" style="display: none;">
            <div class="avatar" id="sidebar-avatar">H</div>
        </div>
        <div class="profile-info">
            <span class="profile-name" id="sidebar-username">Haziq</span>
        </div>
    </div>
    <button type="button" id="logout-btn" class="logout-btn" title="Log out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
</div>
</aside>

  <main class="main">
    <header class="topbar"><div class="topbar-title">Favorites</div></header>
    <div class="content">
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Saved Outfits</span></div>
        <div id="favorites-grid" class="planner-grid" style="padding:1rem;">
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
