<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Outfits This Week</title>
  <link rel="stylesheet" href="/static/theme.css">
  <script src="/static/app.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/><path d="M8 6V4a2 2 0 0 1 4 0v2"/></svg>
      </div>
      <div class="brand-name">Wardrobe</div>
      <div class="brand-sub">Digital Closet</div>
    </div>

    <div class="sidebar-section">Main</div>

    <a class="nav-item" href="/dashboard">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a class="nav-item" href="/wardrobe">
      <svg viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5z"/><path d="M14 5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V5z"/><path d="M4 17a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2z"/><path d="M14 13a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-6z"/></svg>
      My Wardrobe
    </a>
    <a class="nav-item" href="/outfits">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      Outfit Planner
    </a>
    <a class="nav-item" href="/favorites">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      Favorites
    </a>

    <div class="sidebar-section">Insights</div>

    <a class="nav-item active" href="/calendar">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-4 4"/></svg>
      Outfits Worn This Week
    </a>
    <div class="sidebar-section">Settings</div>

    <a class="nav-item" href="/settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6.1A10 10 0 0 0 2.05 14"/><path d="M5.08 19.14A10 10 0 0 0 12 22c1.39 0 2.72-.28 3.93-.79"/><path d="M19.07 19.07A10 10 0 0 0 22 12a10 10 0 0 0-.08-1.32"/></svg>
      Settings
    </a>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-profile">
    <div class="sidebar-profile-left">
        <div class="avatar-container">
            <img id="sidebar-avatar-img" src="" alt="Profile" style="display: none;">
            <div class="avatar" id="sidebar-avatar">H</div>
        </div>
        <div class="profile-info">
            <span class="profile-name" id="sidebar-username">Haziq</span>
        </div>
    </div>
    <button type="button" id="logout-btn" class="logout-btn" title="Log out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
</div>
  </aside>

  <main class="main">
    <div class="topbar">
        <div class="topbar-title">Weekly Timeline</div>
        <div class="topbar-right">
            <button class="btn-add" id="open-add-modal">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Log Outfit
            </button>
        </div>
    </div>
    
    <div class="content">
        <div class="panel calendar-panel">
            <div class="calendar-header">
                <h3 style="font-family: 'Playfair Display', serif; color: var(--text-main);">My Week</h3>
                <div class="calendar-actions">
                    <button id="prev-week-btn" class="btn-icon">
                        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <span id="current-week-range" style="color: var(--text-main);">...</span>
                    <button id="next-week-btn" class="btn-icon">
                        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                </div>
            </div>
            
            <div class="calendar-grid" id="calendar-grid">
                </div>
        </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="log-outfit-modal">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
      <h3 style="margin:0; font-family:'Playfair Display', serif; color:var(--text-main);">Log an Outfit</h3>
      <button id="close-log-outfit-modal" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-main);">&times;</button>
    </div>

    <div style="margin-bottom:1rem;">
      <label style="display:block; font-size:0.85rem; margin-bottom:0.4rem; color:var(--text-main);">Date</label>
      <input type="date" id="log-outfit-date" style="width:100%; padding:0.6rem; border-radius:6px; border:1px solid rgba(4,93,93,0.2);">
    </div>

    <div style="margin-bottom:1.5rem;">
      <label style="display:block; font-size:0.85rem; margin-bottom:0.4rem; color:var(--text-main);">Outfit</label>
      <select id="log-outfit-select" style="width:100%; padding:0.6rem; border-radius:6px; border:1px solid rgba(4,93,93,0.2);">
      </select>
      <div id="log-outfit-preview" class="outfit-pieces" style="margin-top:0.7rem;"></div>
    </div>

    <button id="save-log-outfit-btn" class="btn-add" style="width:100%; justify-content:center; padding:0.75rem;">Save</button>
  </div>
</div>

</body>
</html>
