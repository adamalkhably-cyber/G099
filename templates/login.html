<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Digital Wardrobe Planner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/login.css">
</head>

<body class="h-full font-sans antialiased text-zinc-900">
    <div class="flex min-h-full">
        <!-- Left Side: Ambient Wardrobe Imagery (Hidden on mobile) -->
        <div class="relative hidden w-0 flex-1 lg:block">
            <img class="absolute inset-0 h-full w-full object-cover"
                src="https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?auto=format&fit=crop&q=80&w=1200"
                alt="Wardrobe Closet Aesthetic">
            <div
                class="absolute inset-0 bg-gradient-to-br from-brand-900/90 via-brand-800/80 to-teal-950/70 mix-blend-multiply">
            </div>

            <!-- Dynamic Quote / Branding Overlay -->
            <div class="absolute inset-0 flex flex-col justify-between p-12 text-white z-10">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-white/10 rounded-xl backdrop-blur-md border border-white/20">
                        <svg class="h-6 w-6 text-brand-100" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M3 12h18M3 18h18" />
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2" />
                        </svg>
                    </div>
                    <span class="text-xl font-bold tracking-tight">Wardrobe Planner</span>
                </div>

                <div class="max-w-md space-y-6">
                    <blockquote class="text-3xl font-light leading-snug">
                        "Style is a way to say who you are without having to speak."
                    </blockquote>
                    <div class="border-l-2 border-brand-500 pl-4">
                        <p class="font-semibold text-lg">Mikhail Fauziwan</p>
                        <p class="text-brand-200 text-sm">Founder of Wardrobe Planner</p>
                    </div>
                </div>

                <p class="text-xs text-brand-200/60">© 2026 Wardrobe Planner Corp. All rights reserved.</p>
            </div>
        </div>

        <!-- Right Side: Shadcn UI Login Form Card -->
        <div
            class="flex flex-1 flex-col justify-center px-4 py-12 sm:px-6 lg:flex-none lg:px-20 xl:px-24 bg-white shadow-2xl z-20">
            <div class="mx-auto w-full max-w-sm lg:w-96">
                <div>
                    <h2 class="text-3xl font-bold tracking-tight text-zinc-900">Welcome back</h2>
                    <p class="mt-2.5 text-sm text-zinc-500">
                        Enter your credentials to access your digital wardrobe.
                    </p>
                </div>

                <!-- Custom Alert/Toast Container -->
                <div id="alert-container" class="hidden mt-4"></div>

                <div class="mt-8">
                    <form id="loginForm" class="space-y-6">
                        <div>
                            <label for="login-email" class="block text-sm font-medium leading-6 text-zinc-700">Email
                                Address</label>
                            <div class="mt-2">
                                <input id="login-email" name="email" type="email" autocomplete="email" required
                                    placeholder="name@example.com"
                                    class="block w-full rounded-md border border-zinc-200 bg-white py-2 px-3 text-zinc-900 shadow-sm placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-brand-600 text-sm transition-all duration-150">
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between">
                                <label for="login-password"
                                    class="block text-sm font-medium leading-6 text-zinc-700">Password</label>
                                <div class="text-sm">
                                    <a href="/forgot-password"
                                        class="font-semibold text-brand-600 hover:text-brand-500 transition-colors">Forgot
                                        Password?</a>
                                </div>
                            </div>
                            <div class="mt-2 relative">
                                <input id="login-password" name="password" type="password"
                                    autocomplete="current-password" required placeholder="Enter your password"
                                    class="block w-full rounded-md border border-zinc-200 bg-white py-2 pl-3 pr-10 text-zinc-900 shadow-sm placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-brand-600 text-sm transition-all duration-150">
                                <button type="button" id="toggle-password"
                                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-zinc-400 hover:text-zinc-600 transition-colors"
                                    aria-label="Toggle password visibility">
                                    <svg id="eye-icon" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                        stroke="currentColor" stroke-width="2">
                                        <!-- Open Eye -->
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                    </svg>
                                    <svg id="eye-off-icon" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24"
                                        stroke="currentColor" stroke-width="2">
                                        <!-- Closed Eye -->
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div>
                            <button type="submit"
                                class="flex w-full justify-center items-center gap-2 rounded-md bg-brand-600 py-2 px-3 text-sm font-semibold text-white shadow-sm hover:bg-brand-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 transition-all duration-150">
                                <span>Login</span>
                            </button>
                        </div>
                    </form>

                    <p class="mt-10 text-center text-sm text-zinc-500">
                        Don’t have an account?
                        <a href="/register"
                            class="font-semibold text-brand-600 hover:text-brand-500 transition-colors">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/login.js" defer></script>
</body>

</html>
