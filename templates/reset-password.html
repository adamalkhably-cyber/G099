<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <link rel="stylesheet" href="/static/reset-password.css">
  <script src="/static/reset-password.js" defer></script>
</head>
<body>
  <div class="auth-container">
    <form id="resetPasswordForm" class="auth-card">
      <h1>Reset Password</h1>
      <p id="resetEmailLabel"></p>

      <input type="text" id="resetCode" placeholder="6-digit verification code" required maxlength="6" inputmode="numeric" pattern="[0-9]{6}">
      <input type="password" id="newPassword" placeholder="New Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

      <button type="submit" class="submit-btn">Change Password</button>

      <p>
        <button type="button" id="resendCodeBtn" class="link-bold" style="background:none; border:none; cursor:pointer; padding:0; font:inherit;">Resend code</button>
      </p>

      <p>
        <a href="/">Back to Login</a>
      </p>
    </form>
  </div>
</body>
</html>
